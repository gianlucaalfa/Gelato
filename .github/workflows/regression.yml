name: Regression Tests

on:
  push:
    branches: [main, fix/hardening-native-versions]
  pull_request:

permissions:
  contents: read

concurrency:
  group: regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Build plugin and run regression tests
        run: dotnet test tests/Gelato.Tests/Gelato.Tests.csproj --configuration Release -p:PreserveTestDependencies=true --logger "trx;LogFileName=regression.trx"
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: regression-results
          path: tests/Gelato.Tests/TestResults/*.trx
