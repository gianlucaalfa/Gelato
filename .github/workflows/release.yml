name: Release

on:
  workflow_dispatch:

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Verify release source before tagging
        run: dotnet test tests/Gelato.Tests/Gelato.Tests.csproj --configuration Release -p:PreserveTestDependencies=true
      - name: Create GitHub release from build.yaml version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version: *"\(.*\)"/\1/p' build.yaml)"
          if [ -z "$VERSION" ]; then
            echo "Unable to read version from build.yaml"
            exit 1
          fi
          echo "Creating release v$VERSION"
          gh release create "v$VERSION" --target "${GITHUB_SHA}" --title "v$VERSION" --generate-notes
