name: Release

on:
  workflow_dispatch:

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          fetch-depth: 0

      - name: Create GitHub release from build.yaml version
        env:
          GH_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          VERSION="$(sed -n 's/^version: *"\(.*\)"/\1/p' build.yaml)"
          if [ -z "$VERSION" ]; then
            echo "Unable to read version from build.yaml"
            exit 1
          fi
          echo "Creating release v$VERSION"
          gh release create "v$VERSION" --target "${GITHUB_SHA}" --title "v$VERSION" --generate-notes
