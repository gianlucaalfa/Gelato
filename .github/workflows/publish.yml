name: "🚀 Publish Plugin"

on:
  release:
    types:
      - released
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-stable
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name == 'workflow_dispatch' || github.event.release.prerelease == false
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      upload_url: ${{ steps.release.outputs.upload_url }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Resolve and validate the exact stable release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/verify_stable_release.py
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Verify release source
        run: dotnet test tests/Gelato.Tests/Gelato.Tests.csproj --configuration Release -p:PreserveTestDependencies=true
  build:
    needs: verify
    uses: jellyfin/jellyfin-meta-plugins/.github/workflows/build.yaml@d9efb2cf637399fac7068ab1ee382079b1fcfa5a
    with:
      dotnet-version: "10.0.*"
      dotnet-target: "net10.0"
  upload:
    runs-on: ubuntu-latest
    needs:
      - build
      - verify
    steps:
      - name: Download Artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0
        with:
          name: build-artifact
      - name: Prepare GitHub Release assets
        run: |-
          for file in ./*; do
            md5sum "${file#./}" > "${file%.*}.md5"
            sha256sum "${file#./}" > "${file%.*}.sha256"
          done
          ls -l
      - name: Upload GitHub Release assets
        uses: shogo82148/actions-upload-release-asset@e6cd4579c50a5d0eb50ca05d0d597daafca8cebb
        with:
          upload_url: ${{ needs.verify.outputs.upload_url }}
          asset_path: ./*
  generate:
    runs-on: ubuntu-latest
    needs:
      - upload
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Update stable manifest without enumerating preview releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/update_stable_feed.py
